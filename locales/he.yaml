  t117: image_generate יוצר תמונות עם FLUX 2 Pro והגדלה אוטומטית פי 2.
  t118: text_to_speech ממיר טקסט לשמע — מושמע כבועות קוליות ב-Telegram.
  t119: send_message יכול להגיע לכל פלטפורמת הודעות מחוברת מתוך סשן.
  t120: כלי ה-todo עוזר לסוכן לעקוב אחרי משימות מורכבות מרובות שלבים במהלך סשן.
  t121: session_search מבצע חיפוש טקסט מלא בכל השיחות הקודמות.
  t122: הסוכן שומר אוטומטית בזיכרון העדפות, תיקונים ועובדות על הסביבה.
  t123: /moa מנתב הנחיה קשה אחת דרך קבוצת המודלים של Mixture of Agents שהגדרת.
  t124: פקודות טרמינל תומכות במצב רקע עם notify_on_complete למשימות ארוכות.
  t125: תהליכי רקע בטרמינל תומכים ב-watch_patterns כדי להתריע על שורות פלט מסוימות.
