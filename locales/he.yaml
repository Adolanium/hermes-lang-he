    default_title: צ'אט Hermes
    root_lobby: "הצ'אט הראשי הזה שמור לפקודות מערכת.\n\nכדי להתחיל צ'אט Hermes חדש, אפשר לפתוח את הנושא All Messages בראש ממשק הבוט ולשלוח שם הודעה כלשהי. Telegram ייצור נושא חדש להודעה הזו; כל נושא פועל כסשן Hermes עצמאי."
    root_new: "כדי להתחיל צ'אט Hermes מקביל חדש, אפשר לפתוח את הנושא All Messages בראש ממשק הבוט ולשלוח שם הודעה כלשהי. Telegram ייצור עבורה נושא חדש.\n\nכל נושא הוא סשן Hermes עצמאי. יש להשתמש ב-/new בתוך נושא קיים רק כדי להחליף את הסשן הנוכחי של אותו נושא."
    new_header: "סשן Hermes חדש התחיל בנושא הזה.\n\nטיפ: לעבודה במקביל, אפשר לפתוח את All Messages ולשלוח שם הודעה כדי ליצור נושא נפרד במקום להשתמש כאן ב-/new. /new מחליף את הסשן שמקושר לנושא הנוכחי."
    help: "/topic — הפעלת מצב ריבוי סשנים בהודעות פרטיות (בוט אחד, הרבה צ'אטים במקביל)\n\nשימוש:\n  /topic             הפעלת מצב נושאים, או הצגת הסטטוס אם הוא כבר פעיל\n  /topic help        הצגת ההודעה הזו\n  /topic off         השבתת מצב נושאים וניקוי קישורי הנושאים\n  /topic <id>        בתוך נושא: שחזור סשן קודם לפי מזהה\n\nאיך זה עובד:\n1. מריצים /topic פעם אחת בצ'אט הפרטי הזה — Hermes בודק שהגדרות\n   Threads Settings ב-BotFather מופעלות ומפעיל מצב ריבוי סשנים.\n2. מקישים על All Messages בראש הבוט ושולחים הודעה כלשהי.\n   Telegram יוצר נושא חדש להודעה הזו; כל נושא הוא\n   סשן Hermes עצמאי (היסטוריה חדשה, הקשר חדש).\n3. הצ'אט הפרטי הראשי הופך ללובי מערכת — שם שולחים /topic, /status,\n   /help, /usage. הנחיות רגילות נשלחות בתוך נושא.\n4. /new בתוך נושא מאפס רק את הסשן של אותו נושא.\n5. /topic <id> בתוך נושא משחזר אליו סשן ישן."
