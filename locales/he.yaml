    thread_ready: "נושאים מרובי סשנים ב-Telegram מופעלים.\n\nהנושא הזה ישמש כסשן Hermes עצמאי. אפשר להשתמש ב-/new כדי להחליף את הסשן הנוכחי של הנושא. לעבודה במקביל, אפשר לפתוח את All Messages ולשלוח שם הודעה כדי ליצור נושא נוסף."
