  t108: delegate_task מפעיל כברירת מחדל עד 10 סוכני משנה במקביל (delegation.max_concurrent_children) עם הקשרים מבודדים לעבודה מקבילית.
  t109: web_extract עובד גם על כתובות של קובצי PDF — כל קישור ל-PDF מומר ל-markdown.
