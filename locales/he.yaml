  t127: לכל פרופיל יש הגדרות, מפתחות API, זיכרון, סשנים, מיומנויות ומשימות cron משלו.
  t128: שמות פרופילים הופכים לפקודות shell — 'hermes profile create coder' יוצר את הפקודה 'coder'.
  t129: hermes profile export coder -o backup.tar.gz יוצר ארכיון פרופיל נייד.
  t130: אם שני פרופילים חולקים בטעות טוקן בוט, ה-Gateway השני נחסם עם שגיאה ברורה.
  t131: סשנים מקבלים אוטומטית כותרת תיאורית אחרי חילופי הדברים הראשונים — אין צורך לתת שם ידנית.
  t132: 'כותרות סשנים תומכות בשושלת: "my project" → "my project #2" → "my project #3".'
  t133: ביציאה, Hermes מדפיס פקודת חידוש עם מזהה הסשן ונתונים סטטיסטיים.
