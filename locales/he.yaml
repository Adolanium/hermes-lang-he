    summary_cli: '  💾 סקירת שיפור עצמי: {summary}'
    summary_callback: '💾 סקירת שיפור עצמי: {summary}'
    aux_failure_label: סקירת רקע
  notice:
    uncompressed_context_overflow: '⚠️ הקשר הסשן (~{tokens} טוקנים) חורג מחלון ההקשר של המודל (~{context_length} טוקנים), והדחיסה מושבתת (compression.enabled: false). אפשר להשתמש ב-/compact כדי לדחוס את ההיסטוריה, או להפעיל דחיסה ב-config.yaml.'
explainer:
  no_reply_prefix: '⚠️ אין תשובה: '
  empty_response: '{model} לא החזיר תשובה הפעם, גם אחרי ניסיונות חוזרים. אפשר לשלוח `continue` כדי לנסות שוב, או להחליף מודל עם /model.'
  exit:
    all_retries_exhausted_no_response: ספק המודל לא ענה גם אחרי כל הניסיונות החוזרים. אפשר לשלוח /retry, או להחליף מודל עם /model.
    partial_stream_recovery: הזרימה נעצרה מוקדם ורק חלק מהתשובה שוחזר. אפשר לשלוח `continue` כדי להמשיך מהמקום שבו נעצרה.
    fallback_prior_turn_content: לא נוצר תוכן חדש בתור הזה; מוצג הקשר קודם ששוחזר. אפשר לשלוח `continue` כדי לנסות שוב.
    redirect_restart_limit_exceeded: הבקשה בוטלה בכל ניסיון בגלל תיקון חדש, ולכן התור נעצר במקום לנסות שוב בלי סוף. התיקון האחרון ממתין בתור כהודעה הבאה.
    rebuilt_restart_limit_exceeded: כל הספקים בשרשרת הגיבוי המשיכו להיכשל, ולכן התור נעצר במקום לנסות שוב בלי סוף. אפשר לשלוח `continue` או להחליף ספק.
    budget_exhausted: תקציב האיטרציות/העלות לתור נוצל לפני שהתקבלה תשובה סופית. אפשר לשלוח `continue` כדי להמשיך.
    ollama_runtime_context_too_small: חלון ההקשר של המודל המקומי היה קטן מדי כדי לסיים. יש להגדיל את גודל ההקשר או להשתמש במודל גדול יותר.
    pending_tool_result: התור נעצר בזמן שתוצאת כלי עדיין הייתה בהמתנה, והמודל לא הפיק טקסט המשך. אפשר לשלוח `continue` כדי לאפשר לו לסכם.
    interrupted_during_api_call: הבקשה נקטעה באמצע הקריאה, לפני שהתקבלה תשובה. אפשר לשלוח `continue` כדי לנסות שוב.
    max_iterations_reached: הושגה המגבלה המרבית של איטרציות כלים לפני שהתקבלה תשובה סופית. אפשר לשלוח `continue` כדי להמשיך, או להגדיל את `max_iterations`.
    error_near_max_iterations: אירעה שגיאה סמוך למגבלת האיטרציות, לפני שהתקבלה תשובה סופית. יש לבדוק את פלט הכלים למעלה, ואז לשלוח `continue`.
    repeated_outer_errors: התור המשיך להיכשל בשגיאות חוזרות ונעצר מוקדם במקום לנסות שוב בלי סוף. יש לבדוק את השגיאות למעלה, ואז לשלוח `continue` כדי לנסות שוב.
  persistence:
    compression: התור נעצר כי תהליך אחר דחס את הסשן הזה. ההודעה אמורה כבר להיות שמורה — יש לשלוח אותה שוב אחרי שהדחיסה תסתיים.
    compression_closed: התור נעצר כי הסשן הזה הוחלף בעקבות דחיסת הקשר, ולא ניתן היה לאמץ את ההמשך החי שלו. האחסון עצמו תקין — יש לרענן את הלקוח (או להתחיל תור חדש) כדי שיקלוט את מזהה הסשן החדש, ואז לשלוח את ההודעה שוב.
    turn_lease: התור נעצר כי תהליך Hermes אחר השתלט על הסשן הזה. התשובה לא נשמרה — יש להמתין שהתהליך האחר יסיים, ואז לשלוח את ההודעה שוב.
    session_row_missing: הסשן הזה נמחק מהאחסון בזמן שהצ'אט עדיין היה פתוח, ו-Hermes לא הצליח ליצור אותו מחדש, ולכן ההודעה הזו לא נשמרה. יש לשלוח את ההודעה שוב; אם הכשל חוזר, להריץ `hermes {profile_arg}doctor`.
    locked: התור נעצר כי אחסון הסשנים היה תפוס (תהליך Hermes אחר כתב למסד נתוני המצב). ההודעה אמורה כבר להיות שמורה — יש לשלוח אותה שוב בעוד רגע.
    replaced: קובץ מסד נתוני הסשנים הוחלף בזמן ש-Hermes פעל, ולכן ההודעה הזו לא נשמרה (עותק נשמר ב-{home}/sessions/). יש לעצור את Hermes (`hermes {profile_arg}gateway stop`), להריץ `hermes {profile_arg}doctor` — לא `hermes {profile_arg}doctor --fix`, שיתקן במקום את הקובץ הלא נכון — ואז להפעיל אותו מחדש ולשלוח את ההודעה שוב. שלבי שחזור מתקדמים מופיעים ביומן.
    deleted_wal: 'תהליך Hermes אחר עדיין מחזיק עותק ישן של יומן הכתיבה מראש (write-ahead log) של מסד נתוני הסשנים, ולכן Hermes הפסיק לכתוב כדי לשמור על הקובץ, וההודעה הזו לא נשמרה (עותק נשמר ב-{home}/sessions/). שום דבר לא אבד. יש לסגור כל תהליך Hermes בפרופיל הזה (אפליקציית Desktop, `hermes {profile_arg}gateway stop`, לוח הבקרה, Cron), להריץ `hermes {profile_arg}doctor` — הוא מציין כל תהליך שעדיין מחזיק את היומן — ואז להפעיל את Hermes מחדש ולשלוח את ההודעה שוב. אין להריץ `doctor --fix` או למחוק קובצי state.db בזמן שהם פועלים. מדריך: {recovery_docs}'
    corrupt: "התור נעצר כי מסד נתוני המצב דיווח על השחתה מבנית (התמליל היה הולך לאיבוד באתחול). פינוי מקום בדיסק לא יעזור. אפשרויות שחזור:\n1. להריץ `hermes {profile_arg}doctor --fix`\n2. לעצור את ה-Gateway, ואז לשחזר עם:\n   hermes {profile_arg}sessions recover --source {db_path} --inspect-only\n   (אם הוא מדווח שאפשר לשחזר) hermes {profile_arg}sessions recover --source {db_path} --output recovered-state.db\n   — השחזור מצלם קודם את הקובץ הפגום; אין להריץ `sqlite3 ... \".recover\"` על ה-state.db החי, כלי sqlite3 פגיע עלול להשחית אותו עוד יותר\n3. לשחזר מגיבוי ב-{backups_dir}/\nואז לשלוח את ההודעה שוב."
    fts_index: 'התור נעצר כי אינדקס החיפוש של הסשנים (FTS5) פגום ולא ניתן היה לנתק אותו, ולכן ההודעה הזו לא נשמרה. מאגר ההודעות עצמו לא נפגע: אין להריץ כלי שחזור או לשחזר מגיבוי. יש להריץ `hermes {profile_arg}doctor --fix` (או להפעיל מחדש את Hermes, שמתקן את האינדקס בפתיחה), ואז לשלוח את ההודעה שוב.'
    disk: 'Hermes לא הצליח לשמור את השיחה הזו בדיסק, ולכן עצר כדי לא לאבד את ההודעות. כנראה שהדיסק מלא: יש לפנות מקום (או לתקן את ההרשאות של {home}/state.db), ואז לשלוח את ההודעה שוב.'
    default: 'Hermes לא הצליח לשמור את השיחה הזו, ולכן עצר כדי לא לאבד את ההודעות. סיבות אפשריות: אין מקום בכונן, או שתהליך Hermes אחר מחזיק את מסד הנתונים. יש לסגור חלונות Hermes אחרים, להריץ `hermes {profile_arg}doctor` כדי לבדוק את האחסון, ואז לשלוח את ההודעה שוב.'
  file_mutation:
    header: '⚠️ מאמת שינויי הקבצים: {count} עריכות קבצים נכשלו בתור הזה, גם אם הניסוח למעלה מרמז אחרת. אפשר להריץ `git status` או `read_file` כדי לוודא מה באמת נשמר.'
    failed: נכשל
  shared:
    and_more: '  • … ועוד {count}'
    the_model: המודל
tips:
  t001: /bg <prompt> מריץ משימה בסשן נפרד בזמן שהסשן הנוכחי נשאר פנוי; /btw <question> עונה על שאלה צדדית על השיחה בלי להפריע לה.
  t002: /branch מפצל את הסשן הנוכחי, כך שאפשר לבדוק כיוון אחר בלי לאבד את ההתקדמות.
  t003: /compress דוחס ידנית את הקשר השיחה כשהיא מתארכת.
  t004: /rollback מציג את נקודות השמירה של מערכת הקבצים — אפשר לשחזר קבצים שהסוכן שינה לכל מצב קודם.
  t005: /rollback diff 2 מציג מה השתנה מאז נקודת שמירה 2 בלי לשחזר דבר.
  t006: /rollback 2 src/file.py משחזר קובץ יחיד מנקודת שמירה מסוימת.
  t007: /title "my project" נותן שם לסשן — אפשר לחדש אותו אחר כך עם /resume או hermes -c.
  t008: /resume ממשיך מהנקודה שבה עצרת בסשן שקיבל שם.
  t009: /queue <prompt> מוסיף הודעה לתור לתור הבא בלי להפריע לתור הנוכחי.
  t010: /undo מסיר מהשיחה את חילופי הדברים האחרונים בין המשתמש לעוזר.
  t011: /retry שולח מחדש את ההודעה האחרונה — שימושי כשהתגובה של הסוכן לא הייתה מדויקת.
  t012: '/verbose עובר בין מצבי תצוגת התקדמות הכלים: off → new → all → verbose.'
  t013: /reasoning high מגביר את עומק החשיבה של המודל. /reasoning show מציג את החשיבה.
  t014: /fast מפעיל או מכבה עיבוד בעדיפות לתגובות API מהירות יותר (תלוי בספק).
  t015: /yolo מדלג על כל בקשות האישור לפקודות מסוכנות עד סוף הסשן.
  t016: /model מאפשר להחליף מודל באמצע סשן — אפשר לנסות /model sonnet או /model gpt-5.
  t017: /model --global משנה את מודל ברירת המחדל לצמיתות.
  t018: /personality pirate מגדיר אישיות משעשעת — 14 אפשרויות מובנות, מ-kawaii ועד shakespeare.
  t019: /skin משנה את ערכת הנושא של ה-CLI — אפשר לנסות ares, mono, slate, poseidon או charizard.
  t020: /statusbar מציג או מסתיר שורה קבועה עם המודל, הטוקנים, אחוז מילוי ההקשר, העלות ומשך הזמן.
  t021: /tools disable browser מסיר זמנית את כלי הדפדפן מהסשן הנוכחי.
  t022: /browser connect מחבר את כלי הדפדפן לדפדפן ממשפחת Chromium שרץ אצלך, דרך CDP.
  t023: /plugins מציג את התוספים המותקנים ואת המצב שלהם.
  t024: /cron מנהל משימות מתוזמנות — אפשר להגדיר הנחיות חוזרות עם שליחה לכל פלטפורמה.
  t025: /reload-mcp טוען מחדש את הגדרות שרתי MCP בלי הפעלה מחדש.
  t026: /usage מציג שימוש בטוקנים, פירוט עלויות ומשך הסשן.
  t027: /insights מציג נתוני שימוש של 30 הימים האחרונים.
  t028: /paste בודק אם יש תמונה בלוח ומצרף אותה להודעה הבאה.
  t029: /profile מציג איזה פרופיל פעיל ואת תיקיית הבית שלו.
  t030: /config מציג את ההגדרות הנוכחיות במבט אחד.
  t031: /stop עוצר את כל תהליכי הרקע שהסוכן הפעיל.
  t032: '@file:path/to/file.py מזריק את תוכן הקובץ ישירות להודעה.'
  t033: '@file:main.py:10-50 מזריק רק את שורות 10–50 של קובץ.'
  t034: '@folder:src/ מזריק את עץ התיקיות.'
  t035: '@diff מזריק להודעה את שינויי ה-git שעוד לא הוכנו ל-commit.'
  t036: '@staged מזריק את שינויי ה-git שהוכנו ל-commit (git diff --staged).'
  t037: '@git:5 מזריק את 5 ה-commits האחרונים עם ה-patches המלאים.'
  t038: '@url:https://example.com מוריד ומזריק את תוכן דף האינטרנט.'
  t039: הקלדת @ מפעילה השלמה של נתיבי קבצים — אפשר לנווט לכל קובץ באופן אינטראקטיבי.
  t040: 'אפשר לשלב כמה הפניות: "Review @file:main.py and @file:test.py for consistency."'
  t041: Alt+Enter מוסיף שורה חדשה לקלט מרובה שורות. (Windows Terminal תופס את Alt+Enter — במקרה כזה יש להשתמש ב-Ctrl+Enter.)
  t042: Ctrl+C עוצר את הסוכן. לחיצה כפולה תוך 2 שניות מבצעת יציאה כפויה.
  t043: Ctrl+Z מעביר את Hermes לרקע — כדי לחזור, מריצים fg ב-shell.
  t044: Tab מקבל את טקסט ההצעה האוטומטית או משלים פקודות לוכסן.
  t045: אפשר להקליד הודעה חדשה בזמן שהסוכן עובד כדי לעצור אותו ולכוון אותו מחדש.
  t046: Alt+V מדביק תמונה מהלוח לתוך השיחה.
  t047: הדבקה של 5 שורות או יותר נשמרת אוטומטית לקובץ, ובמקומה מוכנסת הפניה קומפקטית.
  t048: hermes -c מחדש את סשן ה-CLI האחרון. hermes -c "project name" מחדש לפי כותרת.
  t049: hermes -w יוצר git worktree מבודד — מושלם לתהליכי עבודה מקבילים של סוכנים.
  t050: 'hermes -w -q "Fix issue #42" משלב בידוד worktree עם שאילתה חד-פעמית.'
  t051: hermes chat -t web,terminal מפעיל רק ערכות כלים מסוימות לסשן ממוקד.
  t052: hermes chat -s github-pr-workflow טוען מיומנות מראש בהפעלה.
  t053: hermes chat -q "query" מריץ שאילתה אחת לא אינטראקטיבית ויוצא.
  t054: hermes chat --max-turns 1000 עוקף את מגבלת ברירת המחדל של 500 איטרציות לתור.
  t055: hermes chat --checkpoints מפעיל תמונות מצב של מערכת הקבצים לפני כל שינוי הרסני בקובץ.
  t056: hermes --yolo עוקף את כל בקשות האישור לפקודות מסוכנות לאורך כל הסשן.
  t057: hermes chat --source telegram מתייג את הסשן לסינון ב-hermes sessions list.
  t058: hermes -p work chat רץ תחת פרופיל מסוים בלי לשנות את ברירת המחדל שלך.
  t059: hermes doctor --fix מאבחן ומתקן אוטומטית בעיות הגדרה ותלויות.
  t060: hermes dump מפיק סיכום קומפקטי של ההתקנה — מצוין לדיווחי באגים.
  t061: hermes config set KEY VALUE מנתב אוטומטית סודות ל-.env וכל השאר ל-config.yaml.
  t062: hermes config edit פותח את config.yaml בעורך ברירת המחדל.
  t063: hermes config check סורק אפשרויות הגדרה חסרות או מיושנות.
  t064: hermes sessions browse פותח בורר סשנים אינטראקטיבי עם חיפוש.
  t065: hermes sessions stats מציג את מספר הסשנים לפי פלטפורמה ואת גודל מסד הנתונים.
  t066: hermes sessions prune --older-than 30 מנקה סשנים ישנים.
  t067: hermes skills search react --source skills-sh מחפש בספרייה הציבורית של skills.sh.
  t068: hermes skills check סורק מיומנויות מותקנות מה-hub לאיתור עדכונים במקור.
  t069: hermes skills tap add myorg/skills-repo מוסיף מקור מיומנויות מותאם מ-GitHub.
  t070: hermes skills snapshot export setup.json מייצא את הגדרות המיומנויות לגיבוי או לשיתוף.
  t071: hermes mcp add github --command npx מוסיף שרתי MCP משורת הפקודה.
  t072: hermes mcp serve מריץ את Hermes עצמו כשרת MCP עבור סוכנים אחרים.
  t073: hermes auth add מאפשר להוסיף כמה מפתחות API לסבב במאגר האישורים.
  t074: hermes completion bash >> ~/.bashrc מפעיל השלמה ב-Tab לכל הפקודות והפרופילים.
  t075: hermes logs -f עוקב אחרי agent.log בזמן אמת. --level WARNING --since 1h מסננים את הפלט.
  t076: hermes backup יוצר גיבוי zip של כל תיקיית הבית של Hermes.
  t077: hermes profile create coder יוצר פרופיל מבודד שהופך לפקודה משלו.
  t078: hermes profile create work --clone מעתיק את ההגדרות והמפתחות הנוכחיים לפרופיל חדש.
  t079: hermes update מסנכרן אוטומטית מיומנויות מובנות חדשות לכל הפרופילים.
  t080: hermes gateway install מגדיר את Hermes כשירות מערכת (systemd/launchd).
  t081: hermes memory setup מאפשר להגדיר ספק זיכרון חיצוני (Honcho, Mem0 וכו').
  t082: hermes webhook subscribe יוצר נתיבי webhook מונחי אירועים עם אימות HMAC.
  t083: 'לחיסכון: hermes tools מכבה כלים שלא בשימוש, ו-hermes skills config מצמצם מיומנויות.'
  t084: /reasoning low או /reasoning minimal מורידים את עומק החשיבה מתחת לברירת המחדל (medium) — תגובות מהירות וזולות יותר.
  t085: hermes models מנתב משימות ראייה, דחיסה ומשימות עזר למודלים זולים יותר — חוסך 85%+ מעלות הטוקנים ברקע בלי לפגוע במודל הצ'אט הראשי.
  t086: 'הגדרת display.bell_on_complete: true ב-config.yaml משמיעה צליל כשמשימות ארוכות מסתיימות.'
  t087: 'הגדרת display.streaming: true מציגה את הטוקנים בזמן אמת בזמן שהמודל מייצר אותם.'
  t088: 'הגדרת display.show_reasoning: true מציגה את שרשרת החשיבה של המודל.'
  t089: 'הגדרת display.compact: true מצמצמת רווחים בפלט לתצוגה דחוסה יותר.'
  t090: 'הגדרת display.busy_input_mode: queue מוסיפה הודעות לתור במקום לעצור את הסוכן, ו-steer מזריקה אותן באמצע הריצה דרך /steer.'
  t091: 'הגדרת display.resume_display: minimal מדלגת על סיכום השיחה המלא בחידוש סשן.'
  t092: 'הגדרת compression.threshold: 0.50 קובעת מתי הדחיסה האוטומטית מופעלת (ברירת מחדל: 50% מההקשר).'
  t093: 'הגדרת agent.max_turns: 1000 מאפשרת לסוכן לבצע יותר שלבי קריאה לכלים בכל תור.'
  t094: 'הגדרת file_read_max_chars: 200000 מגדילה את כמות התוכן המרבית בכל קריאה ל-read_file.'
  t095: 'הגדרת approvals.mode: smart מאפשרת ל-LLM לאשר אוטומטית פקודות בטוחות ולדחות אוטומטית פקודות מסוכנות.'
  t096: הגדרת fallback_model ב-config.yaml מעבירה אוטומטית לספק גיבוי במקרה של כשל.
  t097: 'הגדרת privacy.redact_pii: true מבצעת hash למזהי משתמשים ולמספרי טלפון לפני השליחה ל-LLM.'
  t098: 'הגדרת browser.record_sessions: true מקליטה אוטומטית סשני דפדפן כסרטוני WebM.'
  t099: 'הגדרת worktree: true ב-config.yaml יוצרת תמיד git worktree (כמו hermes -w).'
  t100: 'הגדרת security.website_blocklist.enabled: true חוסמת דומיינים מסוימים בכלי האינטרנט.'
  t101: 'הגדרת cron.wrap_response: false שולחת את פלט הסוכן הגולמי בלי הכותרת העליונה/התחתונה של cron.'
  t102: HERMES_TIMEZONE עוקף את אזור הזמן של השרת עם כל מחרוזת אזור זמן של IANA.
  t103: 'החלפת משתני סביבה עובדת ב-config.yaml: יש להשתמש בתחביר ${VAR_NAME}.'
  t104: פקודות מהירות ב-config.yaml מריצות פקודות shell מיד, בלי שימוש בטוקנים.
