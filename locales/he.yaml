  t150: Cron תומך בהשהיות יחסיות (30m), מרווחים (every 2h), ביטויי cron וחותמות זמן ISO.
  t151: משימות cron רצות בסשני סוכן חדשים לגמרי — ההנחיות צריכות לעמוד בפני עצמן.
  t152: המצב הקולי עובד בלי מפתחות API אם faster-whisper מותקן (המרת דיבור לטקסט מקומית וחינמית).
  t153: 'חמישה ספקי TTS זמינים: Edge TTS (חינם), ElevenLabs, OpenAI, NeuTTS (מקומי וחינמי), MiniMax.'
  t154: /voice on מפעיל מצב קולי ב-CLI. Ctrl+B מפעיל או מפסיק הקלטה בלחיצה לדיבור.
  t155: TTS בהזרמה משמיע משפטים כבר בזמן היצירה — אין צורך לחכות לתגובה המלאה.
  t156: הודעות קוליות ב-Telegram, Discord, WhatsApp ו-Slack מתומללות אוטומטית.
