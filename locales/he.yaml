  t143: מיומנויות יכולות להיות מוגבלות למערכות הפעלה מסוימות — חלקן נטענות רק ב-macOS או ב-Linux.
  t144: skills.external_dirs ב-config.yaml מאפשר לטעון מיומנויות מתיקיות מותאמות.
  t145: הסוכן יכול ליצור מיומנויות משלו כזיכרון פרוצדורלי באמצעות skill_manage.
