  t323: HERMES_IGNORE_RULES מדלג על ההזרקה האוטומטית של AGENTS.md, SOUL.md, .cursorrules, הזיכרון ומיומנויות שנטענו מראש.
  t324: HERMES_ACCEPT_HOOKS מאשר אוטומטית shell hooks חדשים שמוגדרים ב-config.yaml, בלי בקשה ב-TTY.
  t325: auxiliary.goal_judge.model מנתב את השופט של /goal למודל זול ומהיר, כדי שעלות הלולאה תישאר כמעט אפס.
  t326: נקודות שמירה מדלגות על תיקיות עם יותר מ-50,000 קבצים, כדי למנוע פעולות git איטיות במונו-ריפו ענקיים.
  t327: 'tts.provider: piper מריץ TTS מקומי ב-44 שפות על ה-CPU — הקולות יורדים אוטומטית אל ~/.hermes/cache/piper-voices/.'
  t328: 'tts.providers.<name>.type: command מחבר כל מנוע TTS של שורת פקודה עם ממלאי המקום {input_path} ו-{output_path}.'
  t329: API_SERVER_ENABLED=true מריץ נקודת קצה תואמת OpenAI לצד ה-Gateway, עבור Open WebUI ו-LibreChat.
  t330: 'GATEWAY_PROXY_URL מפעיל תצורה מפוצלת: הקלט והפלט של הפלטפורמות מקומיים, ועבודת הסוכן מואצלת לשרת API מרוחק.'
  t331: MATRIX_DEVICE_ID קובע מזהה מכשיר יציב ל-E2EE — בלעדיו המפתחות מתחלפים בכל הפעלה ופענוח היסטוריה נשבר.
  t332: TELEGRAM_WEBHOOK_SECRET נדרש בכל פעם ש-TELEGRAM_WEBHOOK_URL מוגדר — אפשר ליצור אותו עם openssl rand -hex 32.
  t333: batch_runner.py --resume מזהה הנחיות שהושלמו לפי הטקסט שלהן, כך ששינוי סדר במערך הנתונים לא מריץ שוב עבודה שהסתיימה.
  t334: '/new פותח סשן חדש במקום (כינוי: /reset) — מזהה סשן חדש, היסטוריה נקייה, וה-CLI נשאר פתוח.'
  t335: /clear מנקה את מסך הטרמינל וגם פותח סשן חדש — קיצור אחד לאיפוס חזותי.
  t336: /history מדפיס את השיחה הנוכחית בלי לצאת מה-CLI — שימושי לקריאה חוזרת מהירה.
  t337: /save כותב את השיחה הנוכחית לדיסק בלי לסיים את הסשן.
  t338: '/status מציג מידע על הסשן במבט אחד: מזהה, כותרת, מודל, שימוש בטוקנים וזמן שחלף.'
  t339: /image <path> מצרף קובץ תמונה מקומי להנחיה הבאה, בלי הדבקה או גרירה.
  t340: /platforms מציג את מצב החיבור של ה-Gateway ושל פלטפורמות ההודעות ישירות מתוך הצ'אט.
  t341: /commands מציג בעמודים את הרשימה המלאה של פקודות הלוכסן והמיומנויות המותקנות — שימושי בפלטפורמות בלי השלמה ב-Tab.
  t342: /toolsets מציג את כל ערכות הכלים הזמינות, כדי לדעת מה -t/--toolsets מקבל.
  t343: /voice tts מפעיל או מכבה מצב TTS בלבד — הסוכן עונה בקול, אבל ההנחיות עדיין מוקלדות.
  t344: /reload-skills סורק מחדש את ~/.hermes/skills/ כך שמיומנויות חדשות מופיעות בלי להפעיל מחדש את הסשן.
  t345: /indicator kaomoji|emoji|unicode|ascii בוחר את סגנון מחוון העבודה ב-TUI שמוצג בזמן ריצות של הסוכן.
  t346: /debug מעלה חבילת תמיכה (מידע מערכת + לוגים) ומחזיר קישורים לשיתוף — עובד גם בצ'אט.
  t347: 'hermes -z "<prompt>" הוא מצב חד-פעמי טהור: התשובה הסופית ב-stdout ותו לא — אידיאלי להעברה בצינור בסקריפטים.'
  t348: hermes chat --pass-session-id מזריק את מזהה הסשן להנחיית המערכת, כך שהסוכן יכול להתייחס אליו.
  t349: hermes chat --image path/to/pic.png מצרף תמונה מקומית לשאילתת -q אחת בלי שלב העלאה נפרד.
  t350: hermes chat --ignore-user-config מדלג על הגדרות המשתמש הפעילות — לדיווחי באגים ולריצות CI שניתן לשחזר.
  t351: hermes chat --source tool מתייג צ'אטים תכנותיים כדי שלא יעמיסו על hermes sessions list.
  t352: hermes dump --show-keys כולל טביעות אצבע מוסתרות של מפתחות API לניפוי באגים מעמיק בתמיכה.
  t353: hermes sessions rename <ID> "new title" משנה שם של כל סשן קודם; hermes sessions delete <ID> מוחק סשן.
  t354: hermes import משחזר גיבוי zip מלא של Hermes; ייצואי סשנים ב-JSON/JSONL מיובאים מדף Sessions בלוח הבקרה.
  t355: hermes fallback מנהל את שרשרת fallback_model באופן אינטראקטיבי — בלי לערוך ידנית את config.yaml.
  t356: hermes pairing מחליף את טוקן הצימוד להודעות פרטיות — מי ששולח הודעה ראשון אחרי ההחלפה מקבל גישה לבוט.
  t357: hermes setup מוביל משתמשים חדשים בהגדרת ספק, מפתחות וחיבור פלטפורמות בתהליך אינטראקטיבי אחד.
  t358: hermes status --deep מריץ בדיקת תקינות מלאה בכל רכיב; hermes status רגיל הוא התצוגה המהירה.
  t359: HERMES_AGENT_TIMEOUT=0 מבטל את העצירה של ה-Gateway בגלל חוסר פעילות עבור סוכן שרץ — לריצות מחקר ארוכות.
  t360: HERMES_ENABLE_PROJECT_PLUGINS=1 טוען אוטומטית תוספים מקומיים של המאגר מ-./.hermes/plugins/ — מותנה באמון מעצם התכנון.
  t361: HERMES_DISABLE_FILE_STATE_GUARD=1 מכבה את ההגנה 'הקובץ השתנה מאז שנקרא' ב-patch וב-write_file.
  t362: HERMES_ALLOW_PRIVATE_URLS=true מאפשר לכלי האינטרנט לגשת ל-localhost ולרשתות פרטיות — כבוי כברירת מחדל במצב Gateway.
  t363: HERMES_OPTIONAL_SKILLS=name1,name2 מתקין אוטומטית מיומנויות נוספות מהקטלוג האופציונלי בהפעלה הראשונה של כל פרופיל.
  t364: HERMES_BUNDLED_SKILLS מצביע על עץ מותאם של מיומנויות מובנות — בשימוש באריזות של Homebrew ו-Nix.
  t365: HERMES_DUMP_REQUEST_STDOUT=1 מדפיס כל מטען של בקשת API ל-stdout במקום לקובצי לוג.
  t366: HERMES_OAUTH_TRACE=1 רושם בלוג, בצורה מוסתרת, ניסיונות החלפה ורענון של טוקני OAuth לניפוי באגים באימות מול ספקים.
  t367: HERMES_STREAM_RETRIES (ברירת מחדל 3) קובע את מספר ניסיונות החיבור מחדש באמצע הזרמה בשגיאות רשת חולפות.
  t368: HERMES_GATEWAY_BUSY_ACK_ENABLED=false משתיק את הודעות האישור ⚡/⏳/⏩ כשמשתמש שולח הודעה לסוכן עסוק.
  t369: HERMES_AGENT_NOTIFY_INTERVAL (ברירת מחדל 180s) קובע באיזו תדירות ה-Gateway שולח עדכוני התקדמות בתורות ארוכים.
  t370: HERMES_RESTART_DRAIN_TIMEOUT (ברירת מחדל 900s) מגביל כמה זמן /restart מחכה לריצות פעילות לפני עצירה כפויה.
  t371: HERMES_CHECKPOINT_TIMEOUT (ברירת מחדל 30s) מגביל את זמן יצירת נקודות השמירה — כדאי להגדיל אותו במונו-ריפו ענקיים.
  t372: 'image_gen.model ב-config.yaml בוחר את מודל ה-FAL: flux-2/klein, gpt-image-2, nano-banana-pro ועוד.'
  t373: image_gen.provider מנתב יצירת תמונות דרך תוסף (OpenAI Images, Codex, FAL) במקום ברירת המחדל.
  t374: AUXILIARY_VISION_BASE_URL + AUXILIARY_VISION_API_KEY מפנים את ניתוח הראייה לכל נקודת קצה תואמת OpenAI.
  t375: API_SERVER_MODEL_NAME מגדיר את שם המודל ב-/v1/models — חיוני לתצורות Open WebUI מרובות פרופילים.
  t376: תוספים ללוח הבקרה מוגשים מ-/dashboard-plugins/<name>/ — פשוט מניחים קבצים ב-~/.hermes/dashboard-plugins/.
  t377: צ'אטים עם --source tool מוחרגים כברירת מחדל מ-hermes sessions list — כדי לראות אותם, יש לציין --source במפורש.
