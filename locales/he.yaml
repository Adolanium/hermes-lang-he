  t136: הזיכרון הוא תמונת מצב קפואה — שינויים מופיעים בהנחיית המערכת רק בתחילת הסשן הבא.
  t137: רשומות זיכרון נסרקות אוטומטית לאיתור דפוסי הזרקת הנחיות והוצאת מידע.
